services:
  plugin:
    build: .
    image: ghcr.io/acme/history-aware:1.0.0
    environment:
      DATABASE_URL: postgres://plugin:plugin@postgres:5432/plugin
      OPENLEASH_PLUGIN_RUNTIME_SECRET: local-development-secret
      PORT: "8080"
    ports:
      - "127.0.0.1:${OPENLEASH_PLUGIN_EXAMPLE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - plugin-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plugin
      POSTGRES_USER: plugin
      POSTGRES_PASSWORD: plugin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugin -d plugin"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - plugin-postgres:/var/lib/postgresql/data

volumes:
  plugin-data:
  plugin-postgres:
