services:
  plugin:
    build:
      context: .
      dockerfile: Dockerfile.bundled-postgres
    image: ghcr.io/acme/history-aware:1.0.0
    environment:
      OPENLEASH_PLUGIN_RUNTIME_SECRET: local-development-secret
      PORT: "8080"
    ports:
      - "127.0.0.1:${OPENLEASH_PLUGIN_EXAMPLE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - plugin-data:/data

volumes:
  plugin-data:
